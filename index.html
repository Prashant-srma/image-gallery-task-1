<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div>
      <p class="eyebrow">MY COLLECTION</p>
      <h1>Image Gallery</h1>
      <p class="subtitle">Explore beautiful moments through a responsive gallery.</p>
    </div>
  </header>

  <main class="container">
    <div class="filters" aria-label="Image categories">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="nature">Nature</button>
      <button class="filter-btn" data-filter="city">City</button>
      <button class="filter-btn" data-filter="travel">Travel</button>
    </div>

    <section class="gallery" id="gallery">
      <article class="card" data-category="nature">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=85" alt="Mountain landscape">
        <div class="card-info"><span>Nature</span><h2>Mountain Escape</h2></div>
      </article>

      <article class="card" data-category="city">
        <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=900&q=85" alt="City skyline">
        <div class="card-info"><span>City</span><h2>Urban Lights</h2></div>
      </article>

      <article class="card" data-category="travel">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=85" alt="Beach and ocean">
        <div class="card-info"><span>Travel</span><h2>Ocean Breeze</h2></div>
      </article>

      <article class="card" data-category="nature">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=85" alt="Forest trees">
        <div class="card-info"><span>Nature</span><h2>Green Forest</h2></div>
      </article>

      <article class="card" data-category="travel">
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=85" alt="Snowy mountains">
        <div class="card-info"><span>Travel</span><h2>Winter Journey</h2></div>
      </article>

      <article class="card" data-category="city">
        <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=900&q=85" alt="City buildings">
        <div class="card-info"><span>City</span><h2>City Stories</h2></div>
      </article>

      <article class="card" data-category="nature">
        <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=900&q=85" alt="Green hills">
        <div class="card-info"><span>Nature</span><h2>Peaceful Hills</h2></div>
      </article>

      <article class="card" data-category="travel">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=85" alt="Lake and mountains">
        <div class="card-info"><span>Travel</span><h2>Road to the Lake</h2></div>
      </article>
    </section>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close" id="closeBtn" aria-label="Close">&times;</button>
    <button class="nav prev" id="prevBtn" aria-label="Previous image">&#10094;</button>

    <div class="lightbox-content">
      <img id="lightboxImage" src="" alt="">
      <div class="caption">
        <span id="lightboxCategory"></span>
        <h2 id="lightboxTitle"></h2>
      </div>
    </div>

    <button class="nav next" id="nextBtn" aria-label="Next image">&#10095;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
